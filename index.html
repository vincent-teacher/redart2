<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>楊梅高中紅土藝術空間</title>
<meta name="description" content="國立楊梅高級中學「紅土藝術空間」歷屆畫展海報、邀請卡與小卡數位典藏，可瀏覽、檢索與互動。">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>

<header class="topbar" id="topbar">
  <a class="brand" href="#/" data-sfx="click">
    <img src="assets/badge.png" alt="楊梅高中校徽" class="brand-badge">
    <img src="assets/logo.svg" alt="紅土藝術空間 Logo" class="brand-logo">
    <span class="brand-text">
      <span class="brand-school">楊梅高中</span>
      <span class="brand-name">紅土藝術空間</span>
    </span>
  </a>
  <nav class="nav" id="nav" aria-label="主選單">
    <a href="#/" data-view="home"><span class="ico">🏠</span>首頁</a>
    <a href="#/browse" data-view="browse"><span class="ico">🖼️</span>展覽瀏覽</a>
    <a href="#/timeline" data-view="timeline"><span class="ico">🕰️</span>時光軸</a>
    <a href="#/search" data-view="search"><span class="ico">🔍</span>檢索</a>
    <a href="#/tour" data-view="tour"><span class="ico">🎞️</span>導覽放映</a>
    <a href="#/game" data-view="game"><span class="ico">🎲</span>互動遊戲</a>
    <a href="#/fav" data-view="fav"><span class="ico">💖</span>我的收藏</a>
    <a href="#/about" data-view="about"><span class="ico">🏛️</span>關於空間</a>
  </nav>
  <div class="tools">
    <form class="quick-search" id="quickSearch" role="search">
      <input type="search" id="quickQ" placeholder="搜尋展名、藝術家、年份…" aria-label="快速搜尋">
      <button type="submit" aria-label="搜尋">🔍</button>
    </form>
    <button class="icon-btn" id="btnSound" title="音效開關" aria-label="音效開關">🔊</button>
    <button class="icon-btn" id="btnSettings" title="顯示設定" aria-label="顯示設定">⚙️</button>
    <button class="icon-btn menu-btn" id="btnMenu" aria-label="開啟選單">☰</button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="footer">
  <div class="footer-inner">
    <img src="assets/badge.png" alt="" class="footer-badge">
    <div>
      <p class="footer-title">國立楊梅高級中學・紅土藝術空間</p>
      <p>座落於啟明樓四樓｜民國 97 年 5 月 9 日落成啟用</p>
      <p class="muted" id="footerStat"></p>
    </div>
    <img src="assets/logo.svg" alt="" class="footer-logo">
  </div>
</footer>

<!-- 設定面板 -->
<aside class="panel" id="settings" hidden aria-label="顯示設定">
  <div class="panel-head"><h2>⚙️ 顯示設定</h2><button class="icon-btn" data-close aria-label="關閉">✕</button></div>
  <div class="setting"><span>文字大小</span>
    <div class="seg" id="fontSeg">
      <button data-fs="0.92">小</button><button data-fs="1">標準</button><button data-fs="1.12">大</button><button data-fs="1.25">特大</button>
    </div>
  </div>
  <label class="setting switch"><span>🔊 互動音效</span><input type="checkbox" id="optSfx"><i></i></label>
  <label class="setting switch"><span>🎵 背景音樂</span><input type="checkbox" id="optMusic"><i></i></label>
  <label class="setting switch"><span>🌸 梅花飄落動畫</span><input type="checkbox" id="optPetals"><i></i></label>
  <label class="setting switch"><span>✨ 卡片立體傾斜</span><input type="checkbox" id="optTilt"><i></i></label>
  <div class="setting"><span>音量</span><input type="range" id="optVol" min="0" max="1" step="0.05"></div>
  <button class="btn ghost small" id="btnReset">清除我的瀏覽紀錄與收藏</button>
</aside>

<!-- 燈箱 -->
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="圖片檢視">
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
  <div class="lb-top">
    <div class="lb-caption" id="lbCaption"></div>
    <div class="lb-actions">
      <button class="icon-btn" id="lbFlip" title="翻面（F）">🔄</button>
      <button class="icon-btn" id="lbZoomOut" title="縮小（-）">➖</button>
      <button class="icon-btn" id="lbZoomReset" title="原始大小（0）">⤢</button>
      <button class="icon-btn" id="lbZoomIn" title="放大（+）">➕</button>
      <a class="icon-btn" id="lbOrig" title="開啟原始高解析檔" target="_blank" rel="noopener">⬇️</a>
      <button class="icon-btn" id="lbClose" title="關閉（Esc）">✕</button>
    </div>
  </div>
  <button class="lb-nav prev" id="lbPrev" aria-label="上一張">‹</button>
  <button class="lb-nav next" id="lbNext" aria-label="下一張">›</button>
  <div class="lb-strip" id="lbStrip"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/exhibitions.js?v=1790572718"></script>
<script src="data/texts.js?v=1790572718"></script>
<script src="js/sound.js"></script>
<script src="js/petals.js"></script>
<script src="js/app.js"></script>
</body>
</html>
