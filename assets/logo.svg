<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="紅土藝術空間 Logo">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2553a"/>
      <stop offset=".55" stop-color="#c63d2c"/>
      <stop offset="1" stop-color="#9c2a2a"/>
    </linearGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <!-- 印章外框：紅土色 -->
  <rect x="10" y="10" width="220" height="220" rx="34" fill="url(#clay)" filter="url(#rough)"/>
  <rect x="24" y="24" width="192" height="192" rx="24" fill="none" stroke="#fff4e6" stroke-width="5" opacity=".9"/>
  <!-- 梅花（呼應校徽） -->
  <g transform="translate(186 56)" fill="#fff4e6" opacity=".95">
    <circle r="7" cy="-9"/><circle r="7" cx="8.6" cy="-2.8"/><circle r="7" cx="5.3" cy="7.3"/>
    <circle r="7" cx="-5.3" cy="7.3"/><circle r="7" cx="-8.6" cy="-2.8"/>
    <circle r="4" fill="#9466b4"/>
  </g>
  <!-- 土地筆觸 -->
  <path d="M40 170 C 80 156, 130 184, 200 164" stroke="#f4b43c" stroke-width="9" fill="none" stroke-linecap="round" opacity=".9"/>
  <text x="112" y="132" text-anchor="middle" font-family="DFKai-SB, BiauKai, KaiTi, 標楷體, serif" font-size="92" font-weight="700" fill="#fff4e6" letter-spacing="-4">紅土</text>
  <text x="120" y="204" text-anchor="middle" font-family="DFKai-SB, BiauKai, KaiTi, 標楷體, serif" font-size="30" fill="#fff4e6" letter-spacing="8">藝術空間</text>
</svg>
